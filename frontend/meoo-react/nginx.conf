# Nginx 配置 — 店分析 (meoo)
# 部署路径: /etc/nginx/conf.d/meoo.conf
#
# 部署后执行:
#   cp nginx.conf /etc/nginx/conf.d/meoo.conf
#   nginx -t && systemctl reload nginx

# ─── Gzip 压缩（API JSON 响应压缩 90%+） ────────
gzip on;
gzip_min_length 1024;
gzip_comp_level 6;
gzip_types application/json application/javascript text/plain text/css text/xml application/xml text/javascript;

# ─── HTTP ─────────────────────────────────────────
server {
    listen 80;
    server_name melody.wang www.melody.wang admin.melody.wang;
    root /www/wwwroot/meoo/dist;
    index index.html;
    server_tokens off;
    client_max_body_size 50m;

    location ~* \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header CDN-Cache-Control "no-cache, no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-cache, no-store" always;
        expires 0;
    }

    location / {
        location ~* \.(js|css)$ {
            add_header Cache-Control "public, max-age=31536000, immutable, s-maxage=0" always;
            add_header Cloudflare-CDN-Cache-Control "no-cache, no-store" always;
        }
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        try_files $uri /index.html;
    }

    location /api/v1/sse {
        proxy_pass http://127.0.0.1:3007;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        chunked_transfer_encoding on;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3007;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-Prefix /api/;
    }

    location /admin/ {
        alias /www/wwwroot/meoo-admin/dist/;
        index index.html;
        location ~* \.(js|css)$ {
            add_header Cache-Control "public, max-age=31536000, immutable, s-maxage=0" always;
            add_header Cloudflare-CDN-Cache-Control "no-cache, no-store" always;
        }
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        try_files $uri $uri/ /admin/index.html;
    }
}

# ─── HTTPS ────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name melody.wang www.melody.wang admin.melody.wang;
    root /www/wwwroot/meoo/dist;
    index index.html;
    server_tokens off;
    client_max_body_size 50m;

    ssl_certificate /etc/letsencrypt/live/melody.wang/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/melody.wang/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location ~* \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header CDN-Cache-Control "no-cache, no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-cache, no-store" always;
        expires 0;
    }

