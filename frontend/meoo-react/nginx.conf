# Nginx 配置 — 店分析 (meoo)
# 部署路径: /etc/nginx/sites-available/meoo → ln -s /etc/nginx/sites-enabled/meoo
#
# 部署后执行:
#   cp nginx.conf /etc/nginx/sites-available/meoo
#   ln -sf /etc/nginx/sites-available/meoo /etc/nginx/sites-enabled/meoo
#   nginx -t && systemctl reload nginx

# ─── HTTP → HTTPS 重定向 ─────────────────────────
server {
    listen 80;
    server_name _;  # 匹配所有域名（单服务器部署）
    return 301 https://$host$request_uri;
}

# ─── HTTPS 主站 ──────────────────────────────────
server {
    listen 443 ssl http2;
    server_name _;

    # SSL 证书（使用 Let's Encrypt certbot 自动续签）
    ssl_certificate     /etc/letsencrypt/live/meoo/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meoo/privkey.pem;

    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # CSP
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: /uploads/; font-src 'self'; connect-src 'self'; frame-ancestors 'none';" always;

    # 隐藏 Nginx 版本号
    server_tokens off;

    # 请求体大小限制
    client_max_body_size 50m;

    # 静态文件 (前端 SPA)
    location / {
        root /www/wwwroot/meoo/dist;
        try_files $uri /index.html;
        autoindex off;

        # ★ 根路径 / 和 /index.html → 永远不缓存
        location = / {
            add_header Cache-Control "no-cache, no-store, must-revalidate, proxy-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate, proxy-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # ★ 强制 HTML 不缓存（确保版本检测脚本每次都执行）
        location = /index.html {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate, proxy-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
        location = / {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate, proxy-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # 静态资源缓存（hash 文件名，永不过期）
        location ~* \.[a-f0-9]{8}\.(js|css)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        # 其他静态资源（1小时缓存）
        location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1h;
            add_header Cache-Control "public";
        }
    }

    # 管理端
    location /admin/ {
        alias /www/wwwroot/meoo-admin/dist/;
        try_files $uri /admin/index.html;
    }

    # SSE 实时推送（禁用缓冲，实时传输）
    location /api/v1/sse {
        proxy_pass http://127.0.0.1:3007;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # ★ SSE 关键配置：禁用缓冲
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;  # 24小时长连接
        proxy_send_timeout 86400s;
        chunked_transfer_encoding on;

        # 禁用 gzip（SSE 文本不宜压缩）
        gzip off;
    }

    # API 反向代理（v1 + 旧版兼容）
    location /api/ {
        # 限流（10 请求/秒，突发 20）
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3007;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # 超时设置
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 缓冲设置（防止大响应撑爆内存）
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
    }

    # 登录接口更严格限流
    location /api/v1/auth/login {
        limit_req zone=login burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3007;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        return 404;
    }

    # 产品图片上传目录
    location /uploads/ {
        alias /www/wwwroot/meoo/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;

        # 允许直接访问图片
        location ~* \.(jpg|jpeg|png|gif|webp|svg)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }

    # 禁止直接访问备份文件
    location ~* \.(bak|backup|old|orig|sql|tar|gz|zip)$ {
        deny all;
        return 404;
    }
}

# ─── 限流区域定义（放在 http {} 块顶层） ─────────
# limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
# limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
