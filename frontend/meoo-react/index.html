    html, body { margin: 0; padding: 0; width: 100%; height: 100%; }

    html.dark, html.dark body { background-color: #1a1a1a !important; color: #ffffff; }

  <script>
    (function() {
      var isInIframe = window.self !== window.top;
      function applyThemeToDOM(theme) {
        document.documentElement.classList.remove('light', 'dark');
        document.documentElement.classList.add(theme);
        document.documentElement.setAttribute('data-theme', theme);
      }
      if (isInIframe) {
        window.addEventListener('message', function(event) {
          if (event.data && typeof event.data.theme === 'string') {
            var theme = event.data.theme;
            if (theme === 'light' || theme === 'dark') applyThemeToDOM(theme);
          }
        });
      } else {
        var saved = localStorage.getItem('dianfx_dark_mode');
        if (saved === 'true') { applyThemeToDOM('dark'); }
        else if (saved === 'false') { applyThemeToDOM('light'); }
        else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) { applyThemeToDOM('dark'); }
        else { applyThemeToDOM('light'); }
      }
      // Enable smooth theme transitions after initial paint
      requestAnimationFrame(function() {
        requestAnimationFrame(function() {
          document.documentElement.classList.add('theme-ready');
        });
      });
    })();
  </script>
  <script>
    // Fix: querySelectorAll throws SyntaxError when selector contains unescaped brackets []
    // e.g. Tailwind arbitrary values like .text-[11px] or .bg-[#e02e24]
    // This patch wraps querySelectorAll/querySelector with try-catch to prevent crashes
    (function() {
      function safeQSA(origFn, context, selector) {
        try { return origFn.call(context, selector); }
        catch(e) {
          if (e instanceof DOMException || e.name === 'SyntaxError') {
            // Try escaping brackets: [ -> \[ and ] -> \]
            try {
              var escaped = selector.replace(/([^\\\]])\[/g, '$1\\[').replace(/([^\\\\])\]/g, '$1\\]');
              return origFn.call(context, escaped);
            } catch(e2) {
              // Return empty result instead of crashing
              return context instanceof Element ? [] : [];
            }
          }
          throw e;
        }
      }
      function safeQS(origFn, context, selector) {
        try { return origFn.call(context, selector); }
        catch(e) {
          if (e instanceof DOMException || e.name === 'SyntaxError') {
            try {
              var escaped = selector.replace(/([^\\\]])\[/g, '$1\\[').replace(/([^\\\\])\]/g, '$1\\]');
              return origFn.call(context, escaped);
            } catch(e2) { return null; }
          }
          throw e;
        }
      }
      var origDocQSA = Document.prototype.querySelectorAll;
      Document.prototype.querySelectorAll = function(s) { return safeQSA(origDocQSA, this, s); };
      var origDocQS = Document.prototype.querySelector;
      Document.prototype.querySelector = function(s) { return safeQS(origDocQS, this, s); };
      var origElQSA = Element.prototype.querySelectorAll;
      Element.prototype.querySelectorAll = function(s) { return safeQSA(origElQSA, this, s); };
      var origElQS = Element.prototype.querySelector;
      Element.prototype.querySelector = function(s) { return safeQS(origElQS, this, s); };
    })();
  </script>
  <script>
    // 鍩熷悕缁戝畾妫€鏌?鈥?闈炴巿鏉冨煙鍚嶇洿鎺ョ櫧灞?
    (function() {
      var allowedHosts = ['localhost', '127.0.0.1', 'melody.wang', 'www.melody.wang', 'admin.melody.wang'];
      try {
        var configHosts = localStorage.getItem('dianfx_allowed_hosts');
        if (configHosts) {
          allowedHosts = allowedHosts.concat(JSON.parse(configHosts));
        }
      } catch(e) {}
      var currentHost = window.location.hostname;
      var isDev = currentHost === 'localhost' || currentHost === '127.0.0.1' || currentHost.startsWith('192.168.');
      if (!isDev && allowedHosts.indexOf(currentHost) === -1) {
        document.documentElement.innerHTML = '';
        document.title = '';
        throw new Error('Unauthorized domain');
      }
    })();
  </script>

<body>
  <div id="root"></div>
    <!-- 版本标记: <%= APP_VERSION %> -->
  <script>
  (function(){
    // 四重缓存防护：fetch远程版本 → pageshow/bfcache → localStorage → 时间戳
    var VER = "<%= APP_VERSION %>";
    var BUILD_TS = "<%= Date.now() %>";
    var hash = window.location.hash;

    // 第一重：同步 fetch 远程版本文件（绕过所有缓存）
    try {
      var xhr = new XMLHttpRequest();
      var ts = Date.now();
      xhr.open('GET', '/build-meta.json?_=' + ts, false);
      xhr.send();
      if (xhr.status === 200) {
        var remote = JSON.parse(xhr.responseText);
        if (remote.buildId && localStorage.getItem('__app_buildId') && 
            localStorage.getItem('__app_buildId') !== remote.buildId) {
          localStorage.setItem('__app_buildId', remote.buildId);
          if ('caches' in window) { caches.keys().then(function(ks){ ks.forEach(function(k){ caches.delete(k); }); }); }
          if ('serviceWorker' in navigator) { navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){ r.unregister(); }); }); }
          window.location.reload(true);
          return;
        }
        localStorage.setItem('__app_buildId', remote.buildId);
      }
    } catch(e) {}

    // 第二重：pageshow + bfcache
    window.addEventListener('pageshow', function(ev) {
      if (ev.persisted) {
        var last = localStorage.getItem('__app_version');
        if (last && last !== VER) {
          localStorage.setItem('__app_version', VER);
          if ('caches' in window) { caches.keys().then(function(ks){ ks.forEach(function(k){ caches.delete(k); }); }); }
          window.location.reload();
        }
      }
    });

    // 第三重：localStorage 版本比对
    if (window.__versionChecked) return;
    window.__versionChecked = true;
    var last = localStorage.getItem('__app_version');
    if (last && last !== VER) {
      localStorage.setItem('__app_version', VER);
      if ('caches' in window) { caches.keys().then(function(ks){ ks.forEach(function(k){ caches.delete(k); }); }); }
      if ('serviceWorker' in navigator) { navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){ r.unregister(); }); }); }
      window.location.reload(true);
      return;
    }

    // 第四重：兜底标记
    localStorage.setItem('__app_version', VER);
    localStorage.setItem('__app_last_loaded', Date.now().toString());

    // ★ 第五重：运行时轮询（已打开页面每隔30秒检测部署更新）
    var POLL_CHECK_INTERVAL = 30000;
    setInterval(function() {
      try {
        var pollXhr = new XMLHttpRequest();
        pollXhr.open('GET', '/build-meta.json?_=' + Date.now(), false);
        pollXhr.send();
        if (pollXhr.status === 200) {
          var pollMeta = JSON.parse(pollXhr.responseText);
          if (pollMeta.buildId && localStorage.getItem('__app_buildId') &&
              localStorage.getItem('__app_buildId') !== pollMeta.buildId) {
            localStorage.setItem('__app_buildId', pollMeta.buildId);
            if ('caches' in window) { caches.keys().then(function(ks){ ks.forEach(function(k){ caches.delete(k); }); }); }
            if ('serviceWorker' in navigator) { navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){ r.unregister(); }); }); }
            window.location.reload(true);
          }
        }
      } catch(e) {}
    }, POLL_CHECK_INTERVAL);
  })();
  </script>
