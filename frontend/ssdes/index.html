<!DOCTYPE html><html lang=zh-CN><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>SSDES v2</title><style>:root{--bg:#080b10;--card:#111620;--bd:#1c2030;--tx:#c9cdd4;--mu:#6b7080;--bl:#4d7cff;--gr:#34d399;--rd:#f87171;--ye:#fbbf24;--pu:#a78bfa;--pi:#f472b6;--or:#fb923c;--cy:#22d3ee}*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;line-height:1.5}.ct{max-width:1440px;margin:0 auto;padding:0 20px}.tb{background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:100}.tb-in{display:flex;align-items:center;justify-content:space-between;height:52px;max-width:1440px;margin:0 auto;padding:0 20px}.lo{font-size:17px;font-weight:700;color:#fff;display:flex;align-items:center;gap:8px}.lo-ic{width:30px;height:30px;background:linear-gradient(135deg,var(--bl),#818cf8);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px}.ss{background:var(--bg);border:1px solid var(--bd);color:var(--tx);padding:6px 12px;border-radius:6px;font-size:13px;outline:none}.btn{padding:7px 14px;border:none;border-radius:6px;cursor:pointer;font-size:12px;font-weight:500}.bp{background:var(--bl);color:#fff}.bg{background:none;color:var(--mu);border:1px solid var(--bd)}.lw{display:flex;align-items:center;justify-content:center;min-height:100vh}.lc{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:36px;width:380px}.lc h1{font-size:22px;color:#fff;text-align:center}.fg{margin-bottom:14px}.fg label{display:block;font-size:12px;color:var(--mu);margin-bottom:5px}.fi{width:100%;padding:9px 12px;background:var(--bg);border:1px solid var(--bd);border-radius:7px;color:var(--tx);font-size:14px;outline:none}.fi:focus{border-color:var(--bl)}.kg{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:16px}.kc{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:14px}.kl{font-size:10px;color:var(--mu);text-transform:uppercase;letter-spacing:.5px}.kv{font-size:24px;font-weight:700}.ks{font-size:10px;color:var(--mu);margin-top:2px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:900px){.g2{grid-template-columns:1fr}}.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:18px}.st{font-size:14px;font-weight:600;color:#fff;margin-bottom:12px;display:flex;align-items:center;gap:8px}.st .dot{width:6px;height:6px;border-radius:50%;background:var(--bl)}.dt{width:100%;border-collapse:collapse}.dt th{text-align:left;padding:9px 10px;font-size:10px;color:var(--mu);text-transform:uppercase;border-bottom:1px solid var(--bd);font-weight:600}.dt td{padding:9px 10px;font-size:12px;border-bottom:1px solid rgba(28,32,48,.5)}.dt tr:hover td{background:rgba(77,124,255,.04)}.badge{display:inline-block;padding:2px 7px;border-radius:3px;font-size:10px;font-weight:600}.bgr{background:rgba(52,211,153,.15);color:var(--gr)}.brd{background:rgba(248,113,113,.15);color:var(--rd)}.tabs{display:flex;gap:1px;margin-bottom:16px;background:var(--card);border-radius:7px;padding:3px;overflow-x:auto;flex-wrap:wrap}.tab{padding:7px 15px;border:none;background:none;color:var(--mu);font-size:12px;cursor:pointer;border-radius:5px;white-space:nowrap}.tab.on{background:var(--bl);color:#fff}.ld{display:flex;align-items:center;justify-content:center;padding:60px;flex-direction:column;gap:10px}.sp{width:24px;height:24px;border:2px solid var(--bd);border-top-color:var(--bl);border-radius:50%;animation:sp .6s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}.err{background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.2);border-radius:7px;padding:11px 14px;color:var(--rd);font-size:12px;margin-bottom:14px}.wf{display:flex;flex-direction:column;gap:3px}.wf-r{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;background:var(--bg);border-radius:5px;font-size:12px}.wf-t{background:rgba(77,124,255,.1);font-weight:600}.rt{display:flex;flex-wrap:wrap;gap:7px}.r-tag{background:var(--bg);border:1px solid var(--bd);padding:7px 12px;border-radius:7px;text-align:center}.r-tag .c{font-size:18px;font-weight:700}.r-tag .n{font-size:10px;color:var(--mu)}.pb{height:4px;border-radius:2px;background:var(--bd);overflow:hidden;margin-top:3px}.pbf{height:100%;border-radius:2px}</style></head><body><div id=r>Loading...</div><script>var A="/api/v1";var K="ssdes_t";
function E(id){return document.getElementById(id)}
function F(n){return n?Number(n).toLocaleString():"0"}
function M(n){return"\xA5"+F(Number(n||0).toFixed(0))}
function Pct(n){return(n||0).toFixed(1)+"%"}
function T(){try{return JSON.parse(localStorage.getItem(K))}catch(e){}}
function S(t){localStorage.setItem(K,JSON.stringify(t))}
function C(){localStorage.removeItem(K)}
async function api(m,p,b){var o={method:m,headers:{"Content-Type":"application/json"}};var t=T();if(t&&t.accessToken)o.headers.Authorization="Bearer "+t.accessToken;if(b)o.body=JSON.stringify(b);try{var r=await fetch(A+p,o);if(r.status===401&&t&&t.refreshToken){var rr=await fetch(A+"/auth/refresh",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({refreshToken:t.refreshToken})});var rj=await rr.json();if(rj.success&&rj.data){S(rj.data);o.headers.Authorization="Bearer "+rj.data.accessToken;r=await fetch(A+p,o)}}var j=await r.json().catch(function(){return{}});return{ok:r.ok,s:r.status,d:j}}catch(e){return{ok:0,s:0,d:{error:e.message}}}}
var G=function(p){return api("GET",p)};var P=function(p,b){return api("POST",p,b)};var stores=[];
function loginPage(msg){var h="";h+="<div style=max-width:400px;margin:100px auto 0;padding:20px>";h+="<div class=card>";h+="<h3 style=text-align:center>SSDES</h3>";if(msg)h+="<div class=err>"+msg+"</div>";h+="<div style=margin-bottom:12px><label style=display:block;margin-bottom:4px;font-size:13px;color:#aaa>Username</label><input class=inp id=lu autofocus></div>";h+="<div style=margin-bottom:12px><label style=display:block;margin-bottom:4px;font-size:13px;color:#aaa>Password</label><input class=inp id=lp type=password></div>";h+="<button class=btn onclick=doLogin() style=width:100%;background:#6366f1;color:#fff>Login</button>";h+="</div></div>";E("r").innerHTML=h;var lp=E("lp");if(lp)lp.onkeydown=function(e){if(e.key==="Enter")doLogin()};}
async function doLogin(){var u=E("lu").value.trim();var p=E("lp").value.trim();if(!u||!p){loginPage("Enter username and password");return}var r=await P("/auth/login",{username:u,password:p});if(r.d.success){S(r.d.data);main()}else{loginPage(r.d.error||"Login failed")}}
function logout(){C();loginPage("")}
async function main(){var h="";h+="<div class=hd><h1>SSDES</h1><button class=btn onclick=logout() style=background:none;border:1px solid #444;color:#aaa>Logout</button></div>";h+="<div class=c>";h+="<div class=tabs>";h+="<button id=tab0 class=\"tab on\" onclick=sw(0)>Stores</button>";h+="<button id=tab1 class=tab onclick=sw(1)>Dashboard</button>";h+="<button id=tab2 class=tab onclick=sw(2)>Upload</button>";h+="</div><div id=tc><div class=ld><div class=spin></div></div></div>";h+="</div>";E("r").innerHTML=h;await ld();sw(0);}
async function sw(n){for(var i=0;i<3;i++){var tb=E("tab"+i);if(tb)tb.className=(i===n?"tab on":"tab")}if(n===0)sh();else if(n===1)await dh();else up()}
async function ld(){var r=await G("/stores");if(r.d.success)stores=r.d.data||[]}
function sh(){var h="";if(!stores.length){h="<div class=card style=text-align:center;padding:60px><p>No stores</p><button class=btn onclick=rc() style=background:#6366f1;color:#fff;margin-top:12px>Sync</button></div>"}else{h+="<div class=sl>";stores.forEach(function(s){h+="<div class=\"card store-card\" onclick=sl("+JSON.stringify(s.id)+")><h3>"+s.name+"</h3></div>"});h+="</div>"}E("tc").innerHTML=h}
async function sl(id){sw(1);await dl(id)}
async function dh(){E("tc").innerHTML="<div class=ld><div class=spin></div></div>";var id=stores.length>0?stores[0].id:"__all__";await dl(id)}
async function dl(id){var r=await G("/analytics/dashboard?storeId="+id);if(!r.d.success||!r.d.data){E("tc").innerHTML="<div class=err>Failed: "+(r.d.error||"unknown")+"<br><button class=btn onclick=dh() style=margin-top:12px;background:none;border:1px solid #444;color:#aaa>Retry</button></div>";return}var k=r.d.data.kpi||{};var h="<h2>Dashboard</h2><div class=stats>";h+="<div class=sc><div class=l>Orders</div><div class=v style=color:#3b82f6>"+F(k.orders)+"</div></div>";h+="<div class=sc><div class=l>GMV</div><div class=v style=color:#6366f1>"+M(k.gmv)+"</div></div>";h+="<div class=sc><div class=l>Revenue</div><div class=v style=color:#22c55e>"+M(k.revenue)+"</div></div>";h+="<div class=sc><div class=l>Refund%</div><div class=v style=color:#eab308>"+(k.refundRate||0).toFixed(1)+"%</div></div>";h+="<div class=sc><div class=l>Promo</div><div class=v style=color:#a855f7>"+M(k.promoCost)+"</div></div>";h+="<div class=sc><div class=l>ROI</div><div class=v style=color:#ec4899>"+(k.promoROI||0).toFixed(2)+"</div></div>";h+="</div>";var r2=await G("/analytics/products/stats?storeId="+id+"&pageSize=20");if(r2.d.success&&r2.d.data){var ps=r2.d.data;var ks=Object.keys(ps);h+="<h3>Products ("+(r2.d.pagination?r2.d.pagination.total:ks.length)+")</h3><table><thead><tr><th>Product</th><th>GMV</th><th>Orders</th><th>Sales</th><th>Refund%</th><th>ROI</th></tr></thead><tbody>";ks.forEach(function(k2){var p=ps[k2];h+="<tr><td>"+(p.productName||k2)+"</td><td>"+M(p.gmv)+"</td><td>"+p.orders+"</td><td>"+p.sales+"</td><td>"+(p.refundRate||0).toFixed(1)+"%</td><td>"+(p.roi||0).toFixed(2)+"</td></tr>"});h+="</tbody></table>"}E("tc").innerHTML=h}
function up(){E("tc").innerHTML="<h2>Upload</h2><div class=card><p>Coming soon</p></div>"}
async function rc(){var r=await G("/stores");if(r.d.success&&r.d.data&&r.d.data.length>0){stores=r.d.data;sh()}else{alert("No data")}}

// ★ v2 新增模块
var tr=null,rg=null,fn=null,lo=null,deepCache={};

function kc(l,v,s,c){return'<div class=kc><div class=kl>'+l+'</div><div class=kv style=color:'+c+'>'+v+'</div><div class=ks>'+s+'</div></div>'}
function cb(l,a,t,c){var p=t>0?(a/t*100):0;return'<div style=margin-bottom:7px><div style=display:flex;justify-content:space-between;font-size:11px;margin-bottom:1px><span>'+l+'</span><span style=color:var(--mu)>'+M(a)+' ('+p.toFixed(1)+'%)</span></div><div class=pb><div class=pbf style=width:'+p+'%;background:'+c+'></div></div></div>'}
function wr(l,a,c){return'<div class=wf-r><span>'+l+'</span><span style=color:'+c+'>'+(a>=0?'+':'')+M(a)+'</span></div>'}
function wt(l,a){return'<div class="wf-r wf-t"><span>'+l+'</span><span style=color:'+(a>=0?'var(--gr)':'var(--rd)')+';font-weight:700">'+(a>=0?'+':'')+M(a)+'</span></div>'}

async function showTrends(){if(!tr||!tr.length){E("tc").innerHTML='<div class=err>No daily trend data</div>';return}var h='<div class=card><div class=st><span class=dot></span>Daily Trends ('+tr.length+' days)</div><div style=overflow-x:auto><table class=dt><thead><tr><th>Date</th><th>GMV</th><th>Revenue</th><th>Orders</th><th>Refund</th></tr></thead><tbody>';tr.forEach(function(d){h+='<tr><td>'+d.date+'</td><td>'+M(d.gmv)+'</td><td>'+M(d.revenue)+'</td><td>'+F(d.orders)+'</td><td>'+M(d.refund)+'</td></tr>'});h+='</tbody></table></div></div>';E("tc").innerHTML=h}
async function showRegions(){if(!rg||!rg.length){E("tc").innerHTML='<div class=err>No region data</div>';return}var max=rg[0]?rg[0].gmv:1;var h='<div class=card><div class=st><span class=dot></span>Province Distribution ('+rg.length+')</div><table class=dt><thead><tr><th>Province</th><th>Orders</th><th>GMV</th><th>Buyers</th></tr></thead><tbody>';rg.forEach(function(r){h+='<tr><td><strong>'+esc(r.province)+'</strong></td><td>'+F(r.orders)+'</td><td>'+M(r.gmv)+'</td><td>'+F(r.buyers)+'</td></tr>'});h+='</tbody></table></div>';E("tc").innerHTML=h}
async function showFinancial(){if(!fn){E("tc").innerHTML='<div class=err>No financial data</div>';return}var h='<div class=kg>';h+=kc("Income(Fin)",M(fn.totalIncome||0),"","var(--gr)");h+=kc("Expense(Fin)",M(fn.totalExpense||0),"","var(--rd)");h+=kc("Order Revenue",M(fn.orderRevenue||0),"","var(--bl)");h+=kc("Income Count",F(fn.incomeCount||0),"","var(--cy)");h+=kc("Expense Count",F(fn.expenseCount||0),"","var(--or)");h+=kc("Total Records",F(fn.totalRecords||0),"","var(--pu)");h+='</div>';E("tc").innerHTML=h}
async function showLogistics(){if(!lo){E("tc").innerHTML='<div class=err>No logistics data</div>';return}var h='<div class=kg>';h+=kc("Total Orders",F(lo.totalOrders||0),"","var(--bl)");h+=kc("Shipped",F(lo.shippedOrders||0),"","var(--gr)");h+=kc("Ship Rate",lo.totalOrders>0?Pct(lo.shippedOrders/lo.totalOrders*100):"--","","var(--cy)");h+=kc("Avg Hours",(lo.avgShipHours||0).toFixed(1)+"h","","var(--pu)");h+='</div>';E("tc").innerHTML=h}
async function showDeep(pid){var r=await G("/analytics/product/deep/"+pid+"?storeId="+cs);if(!r.d.success||!r.d.data){alert("Failed to load");return}var d=r.d.data;var pc=d.productClassification||{};var h='<h2>'+esc(d.productName||pid)+'</h2><div class=kg>';h+=kc("Type",pc.type||"?",pc.stage||"","var(--bl)");h+=kc("Health",(pc.healthScore||0)+"/100","","var(--gr)");h+=kc("Suggestion",pc.suggestion||"--","","var(--mu)");h+='</div>';if(d.skuMatrix&&d.skuMatrix.length){h+='<div class=card><div class=st><span class=dot></span>SKU Matrix</div><table class=dt><thead><tr><th>SKU</th><th>Sales</th><th>GMV</th></tr></thead><tbody>';d.skuMatrix.forEach(function(sk){h+='<tr><td>'+esc(sk.skuName||sk.skuId)+'</td><td>'+F(sk.sales)+'</td><td>'+M(sk.gmv)+'</td></tr>'});h+='</tbody></table></div>'}if(d.rankings){h+='<div class=card><div class=st><span class=dot></span>Rankings</div>';var rk=d.rankings;if(rk.profitRank)h+='<p>Profit: #'+rk.profitRank.rank+'/'+rk.profitRank.total+'</p>';if(rk.gmvRank)h+='<p>GMV: #'+rk.gmvRank.rank+'/'+rk.gmvRank.total+'</p>';if(rk.roiRank)h+='<p>ROI: #'+rk.roiRank.rank+'/'+rk.roiRank.total+'</p>';h+='</div>'}E("tc").innerHTML=h}

// Extended main function
var origMain=main;
main=async function(){await origMain();E("nt").innerHTML='';var tabs=[{id:"ov",label:"Overview"},{id:"pr",label:"Products"},{id:"pm",label:"Promotion"},{id:"af",label:"AfterSale"},{id:"tr",label:"Trends"},{id:"rg",label:"Regions"},{id:"fn",label:"Financial"},{id:"lo",label:"Logistics"}];tabs.forEach(function(t,i){var b=document.createElement("button");b.className="tab"+(i===0?" on":"");b.textContent=t.label;b.onclick=function(){swEx(t.id,b)};E("nt").appendChild(b)})};

var origSw=sw;
sw=function(n){n=n;};
function swEx(id,btn){document.querySelectorAll(".tab").forEach(function(b){b.classList.remove("on")});if(btn)btn.classList.add("on");var map={ov:showOv,pr:showPr,pm:showPm,af:showAf,tr:showTrends,rg:showRegions,fn:showFinancial,lo:showLogistics};(map[id]||showOv)()}

// Extended data loading
var origLd=ld;
ld=async function(){await origLd();var rs=await Promise.all([G("/analytics/trends?storeId="+cs),G("/analytics/regions?storeId="+cs),G("/analytics/financial?storeId="+cs),G("/analytics/logistics?storeId="+cs)]);tr=rs[0].d.success?rs[0].d.data:null;rg=rs[1].d.success?rs[1].d.data:null;fn=rs[2].d.success?rs[2].d.data:null;lo=rs[3].d.success?rs[3].d.data:null};
// Extend product list with deep link
var origShowPr=showPr;
showPr=function(){origShowPr();setTimeout(function(){var rows=document.querySelectorAll("#tc .store-card");rows.forEach(function(r){var orig=r.onclick;})},100)};

(function(){var t=T();if(t&&t.accessToken){main()}else{loginPage("")}})();</script></body></html>
