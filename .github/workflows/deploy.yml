name: 部署到服务器

on:
  push:
    branches:
      - v2-server-deploy-20260527

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 配置 SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: 安装依赖 & 构建前端
        run: |
          npm install
          npm run build

      - name: 构建后端
        working-directory: server
        run: |
          npm install
          npx tsc

      - name: 部署前端到服务器
        run: |
          cd dist && tar czf /tmp/dist.tar.gz . && cd ..
          scp -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key /tmp/dist.tar.gz ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}:/tmp/
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }} "mkdir -p /www/wwwroot/meoo/dist && rm -rf /www/wwwroot/meoo/dist/* && tar xzf /tmp/dist.tar.gz -C /www/wwwroot/meoo/dist/ && rm /tmp/dist.tar.gz && echo 'frontend ok'"

      - name: 部署后端到服务器
        run: |
          cd server && tar czf /tmp/server-dist.tar.gz dist/ package.json && cd ..
          scp -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key /tmp/server-dist.tar.gz ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}:/tmp/
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }} "mkdir -p /www/wwwroot/meoo/server && tar xzf /tmp/server-dist.tar.gz -C /www/wwwroot/meoo/server/ && rm /tmp/server-dist.tar.gz && echo 'backend ok'"

      - name: 安装后端依赖 & 重启服务
        run: |
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }} "cd /www/wwwroot/meoo/server && npm install --production 2>&1 && fuser -k 3007/tcp 2>/dev/null; sleep 1; nohup node dist/index.js > /www/wwwlogs/meoo-server.log 2>&1 & sleep 2; netstat -tlnp 2>/dev/null | grep :3007 && echo '部署完成！'"
