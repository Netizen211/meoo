name: 部署到服务器

on:
  push:
    branches:
      - v2-server-deploy-20260527

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 安装依赖 & 构建前端
        run: |
          npm install
          npm run build

      - name: 构建后端
        working-directory: server
        run: |
          npm install
          npx tsc

      - name: 部署到服务器
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          SOURCE: "dist/"
          TARGET: "/var/www/meoo/dist/"
          ARGS: "-rlgoDzvc --delete"

      - name: 部署后端到服务器
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          SOURCE: "server/dist/"
          TARGET: "/opt/meoo/server/dist/"
          ARGS: "-rlgoDzvc --delete"

      - name: 部署后端 package.json 到服务器
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          SOURCE: "server/package.json"
          TARGET: "/opt/meoo/server/package.json"
          ARGS: "-rlgoDzvc"

      - name: 安装后端依赖 & 重启服务
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/meoo/server
            npm install --production
            systemctl restart meoo-server
            echo "部署完成！"
